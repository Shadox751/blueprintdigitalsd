<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Denver HVAC License Prep — CertifyPro</title>
  <meta name="description" content="Denver Colorado HVAC supervisor license exam prep. Master Mechanical (F29/G29), Residential (F32), Gas Pipefitter (F33), and EPA 608 Universal — pick your track, study what matters." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Source+Sans+3:wght@400;500;600;700;800&family=Source+Code+Pro:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:        #1A1714;
      --ink-mid:    #4A4540;
      --ink-muted:  #8A8480;
      --ink-dim:    #C4C0BA;
      --cream:      #FAF8F4;
      --cream-alt:  #F2EFE9;
      --white:      #FFFFFF;
      --accent:     #C8390E;
      --accent-h:   #A82D08;
      --accent-soft:  rgba(200,57,14,0.08);
      --accent-softer: rgba(200,57,14,0.04);
      --success:    #1A6B3C;
      --success-soft: rgba(26,107,60,0.09);
      --warn:       #B07010;
      --warn-soft:  rgba(176,112,16,0.10);
      --border:     #E4E0D8;
      --border-s:   #CCC8BF;
      --dark:       #1A1714;
      --dark-card:  #222020;
      --shadow:     0 1px 4px rgba(26,23,20,0.06);
      --shadow-md:  0 4px 20px rgba(26,23,20,0.08);
      --shadow-lg:  0 12px 40px rgba(26,23,20,0.12);
      --display:    'Playfair Display', Georgia, serif;
      --body:       'Source Sans 3', system-ui, sans-serif;
      --mono:       'Source Code Pro', 'Courier New', monospace;
    }

    html, body { height: 100%; }
    body { font-family: var(--body); color: var(--ink); background: var(--cream); -webkit-font-smoothing: antialiased; line-height: 1.55; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-h); }
    button { font-family: inherit; cursor: pointer; }

    /* ─── LAYOUT ─────────────────────────────────────────────────────── */
    .app { min-height: 100vh; display: flex; flex-direction: column; }

    .header {
      background: var(--dark); color: #F0EDE8;
      padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      position: sticky; top: 0; z-index: 50;
    }
    .header .brand { display: flex; align-items: center; gap: 10px; }
    .header .brand svg { width: 22px; height: 26px; flex-shrink: 0; }
    .header .brand-name { font-family: var(--display); font-size: 16px; font-weight: 800; letter-spacing: -0.5px; }
    .header .badge-co { background: var(--accent); color: #fff; font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: 1px; padding: 3px 6px; border-radius: 3px; }
    .header .product { font-family: var(--body); font-size: 13px; color: #C4C0BA; }
    .header .track-pill { background: rgba(200,57,14,0.18); color: #F0EDE8; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 1px; padding: 5px 10px; border-radius: 4px; border: 1px solid rgba(200,57,14,0.35); cursor: pointer; }
    .header .track-pill:hover { background: rgba(200,57,14,0.28); }

    .tabs {
      background: var(--white); border-bottom: 1px solid var(--border);
      padding: 0 24px; display: flex; gap: 0; overflow-x: auto;
      position: sticky; top: 56px; z-index: 49;
    }
    .tab {
      background: none; border: none; padding: 14px 18px;
      font-family: var(--body); font-size: 13px; font-weight: 600;
      color: var(--ink-muted); border-bottom: 2px solid transparent;
      transition: all .15s; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px;
    }
    .tab:hover { color: var(--ink); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-icon { font-size: 14px; line-height: 1; }

    .main { flex: 1; padding: 24px; max-width: 1200px; margin: 0 auto; width: 100%; }

    .footer {
      background: var(--cream-alt); border-top: 1px solid var(--border);
      padding: 20px 24px; text-align: center;
      font-family: var(--body); font-size: 12px; color: var(--ink-muted);
    }
    .footer .disclaimer {
      background: var(--warn-soft); color: var(--warn);
      border: 1px solid var(--warn); border-radius: 8px;
      padding: 12px 16px; margin: 12px auto 8px; max-width: 800px;
      font-size: 12px; line-height: 1.6; text-align: left;
    }
    .footer .disclaimer strong { font-weight: 700; }

    /* ─── TRACK PICKER ───────────────────────────────────────────────── */
    .picker {
      position: fixed; inset: 0; background: rgba(26,23,20,0.85); z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      backdrop-filter: blur(6px);
    }
    .picker-card {
      background: var(--cream); border-radius: 18px; max-width: 720px; width: 100%;
      max-height: 90vh; overflow-y: auto;
      box-shadow: var(--shadow-lg); padding: 36px;
    }
    .picker h1 {
      font-family: var(--display); font-size: 30px; font-weight: 800; letter-spacing: -0.5px;
      color: var(--ink); margin-bottom: 6px;
    }
    .picker .subtitle {
      font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 2px;
      color: var(--accent); text-transform: uppercase; margin-bottom: 14px;
    }
    .picker p.lead { font-size: 15px; color: var(--ink-mid); margin-bottom: 22px; line-height: 1.6; }
    .picker .options { display: grid; gap: 12px; }
    .picker .opt {
      background: var(--white); border: 1.5px solid var(--border); border-radius: 12px;
      padding: 16px 18px; text-align: left; transition: all .15s;
      display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
      width: 100%; font-family: inherit; color: inherit;
    }
    .picker .opt:hover { border-color: var(--accent); background: var(--accent-softer); transform: translateY(-1px); }
    .picker .opt-title { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
    .picker .opt-desc  { font-size: 13px; color: var(--ink-muted); line-height: 1.5; }
    .picker .opt-meta  { font-family: var(--mono); font-size: 10px; color: var(--accent); font-weight: 700; letter-spacing: 1px; }
    .picker .opt-arrow { color: var(--accent); font-size: 18px; }
    .picker-foot {
      margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border);
      font-size: 12px; color: var(--ink-muted); line-height: 1.55;
    }
    .picker-foot strong { color: var(--warn); font-weight: 700; }

    /* ─── CARDS ──────────────────────────────────────────────────────── */
    .card {
      background: var(--white); border: 1px solid var(--border); border-radius: 12px;
    }
    .badge {
      display: inline-block; font-family: var(--mono); font-size: 9px; font-weight: 700;
      letter-spacing: 1px; padding: 3px 8px; border-radius: 3px; text-transform: uppercase;
    }
    .pill {
      display: inline-block; font-family: var(--mono); font-size: 9px; font-weight: 700;
      letter-spacing: 1px; padding: 2px 7px; border-radius: 99px; text-transform: uppercase;
    }
    .pill.track { background: var(--accent-soft); color: var(--accent); margin-right: 4px; }

    /* ─── DASHBOARD ──────────────────────────────────────────────────── */
    .hero {
      background: linear-gradient(135deg, var(--dark) 0%, #2A2624 100%);
      color: #F0EDE8; border-radius: 16px; padding: 32px;
      margin-bottom: 24px; position: relative; overflow: hidden;
    }
    .hero::after {
      content: ''; position: absolute; top: -50%; right: -10%;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(200,57,14,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero h2 { font-family: var(--display); font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
    .hero p { font-size: 15px; color: #C4C0BA; line-height: 1.6; max-width: 560px; }
    .hero .stats { display: flex; gap: 28px; margin-top: 20px; flex-wrap: wrap; }
    .hero .stat-num { font-family: var(--display); font-size: 30px; font-weight: 800; color: #F0EDE8; line-height: 1; }
    .hero .stat-lbl { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--accent); text-transform: uppercase; margin-top: 4px; }

    .progress-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap: 16px; margin-bottom: 24px; }
    .pcard { padding: 18px; }
    .pcard .pcard-lbl { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
    .pcard .pcard-val { font-family: var(--display); font-size: 26px; font-weight: 800; color: var(--ink); line-height: 1; margin-bottom: 8px; }
    .pcard .bar-bg { background: var(--border); height: 5px; border-radius: 99px; overflow: hidden; }
    .pcard .bar { background: var(--accent); height: 100%; border-radius: 99px; transition: width .6s ease; }

    .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 24px 0 12px; }
    .section-head h3 { font-family: var(--display); font-size: 20px; font-weight: 800; color: var(--ink); letter-spacing: -0.3px; }
    .section-head .hint { font-family: var(--mono); font-size: 10px; color: var(--ink-muted); letter-spacing: 1px; text-transform: uppercase; }

    /* ─── MODULE GRID ────────────────────────────────────────────────── */
    .mod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 14px; }
    .mod-card {
      background: var(--white); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px; text-align: left; transition: all .15s; cursor: pointer;
      display: flex; flex-direction: column; gap: 8px;
    }
    .mod-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .mod-card .mod-num { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: 1.5px; }
    .mod-card .mod-title { font-family: var(--display); font-size: 17px; font-weight: 800; color: var(--ink); line-height: 1.3; }
    .mod-card .mod-articles { font-size: 12px; color: var(--ink-muted); line-height: 1.6; }
    .mod-card .mod-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
    .mod-card .mins { font-family: var(--mono); font-size: 10px; color: var(--ink-muted); letter-spacing: 0.5px; }
    .mod-card.done { border-color: var(--success); background: var(--success-soft); }
    .mod-card.done .mod-num { color: var(--success); }

    /* ─── MODULE READER ──────────────────────────────────────────────── */
    .reader { max-width: 800px; margin: 0 auto; }
    .reader .back { background: none; border: none; color: var(--accent); font-size: 13px; font-weight: 600; padding: 0 0 12px; }
    .reader h2 { font-family: var(--display); font-size: 30px; font-weight: 800; color: var(--ink); letter-spacing: -0.5px; margin-bottom: 6px; }
    .reader .mod-sub { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 1.5px; margin-bottom: 18px; }
    .reader .article-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
    .reader .art-tab {
      background: none; border: none; padding: 10px 14px;
      font-family: var(--body); font-size: 13px; font-weight: 600; color: var(--ink-muted);
      border-bottom: 2px solid transparent; white-space: nowrap;
    }
    .reader .art-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .reader .art-content {
      font-size: 15px; line-height: 1.7; color: var(--ink-mid);
    }
    .reader .art-content p { margin-bottom: 16px; }
    .reader .art-content strong { color: var(--ink); font-weight: 700; }
    .reader .art-content .trap {
      background: var(--warn-soft); border-left: 3px solid var(--warn);
      padding: 14px 18px; margin: 18px 0; border-radius: 0 8px 8px 0;
      font-size: 14px; color: var(--ink);
    }
    .reader .art-content .trap-label {
      display: block; font-family: var(--mono); font-size: 10px; color: var(--warn); font-weight: 700; letter-spacing: 1.5px; margin-bottom: 4px; text-transform: uppercase;
    }
    .reader .art-content .formula {
      background: var(--cream-alt); border: 1px solid var(--border);
      padding: 14px 18px; margin: 18px 0; border-radius: 8px;
      font-family: var(--mono); font-size: 13px; color: var(--ink); line-height: 1.6;
    }
    .reader .art-content .formula-label {
      display: block; font-family: var(--mono); font-size: 10px; color: var(--accent); font-weight: 700; letter-spacing: 1.5px; margin-bottom: 6px; text-transform: uppercase;
    }
    .reader .mark-done {
      display: block; width: 100%; padding: 14px; margin-top: 24px;
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 700; letter-spacing: 0.3px;
    }
    .reader .mark-done.done { background: var(--success); }
    .reader .mark-done:hover { background: var(--accent-h); }
    .reader .mark-done.done:hover { background: var(--success); opacity: .9; }

    /* ─── QUIZ ───────────────────────────────────────────────────────── */
    .quiz { max-width: 720px; margin: 0 auto; }
    .quiz-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
    .quiz-head h2 { font-family: var(--display); font-size: 24px; font-weight: 800; color: var(--ink); }
    .quiz-head .qnum { font-family: var(--mono); font-size: 12px; color: var(--ink-muted); letter-spacing: 1px; }
    .quiz-card { padding: 24px; margin-bottom: 16px; }
    .quiz-art {
      font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--accent);
      letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px;
    }
    .quiz-q { font-size: 16px; line-height: 1.6; color: var(--ink); margin-bottom: 18px; font-weight: 500; }
    .quiz-opts { display: grid; gap: 8px; }
    .quiz-opt {
      background: var(--white); border: 1.5px solid var(--border); border-radius: 8px;
      padding: 14px 16px; text-align: left; font-size: 14px; color: var(--ink-mid);
      transition: all .12s; font-family: inherit;
    }
    .quiz-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-softer); }
    .quiz-opt.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
    .quiz-opt.correct { border-color: var(--success); background: var(--success-soft); color: var(--ink); }
    .quiz-opt.wrong { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); opacity: .85; }
    .quiz-opt:disabled { cursor: default; }
    .quiz-exp {
      background: var(--cream-alt); border-left: 3px solid var(--ink-muted);
      padding: 14px 18px; margin-top: 16px; border-radius: 0 8px 8px 0;
      font-size: 13px; line-height: 1.65; color: var(--ink-mid);
    }
    .quiz-exp.correct { border-left-color: var(--success); }
    .quiz-exp.wrong   { border-left-color: var(--accent); }
    .quiz-exp .exp-lbl { display: block; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }
    .quiz-exp.correct .exp-lbl { color: var(--success); }
    .quiz-exp.wrong   .exp-lbl { color: var(--accent); }
    .quiz-controls { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

    /* ─── BUTTONS ────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 22px; border-radius: 8px; font-family: var(--body);
      font-size: 14px; font-weight: 700; border: none; transition: all .15s;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-h); }
    .btn-ghost { background: none; color: var(--ink-mid); border: 1px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--ink-muted); color: var(--ink); }
    .btn-dark { background: var(--dark); color: #F0EDE8; }
    .btn-dark:hover:not(:disabled) { background: #2A2624; }
    .btn-small { padding: 8px 14px; font-size: 12px; }

    /* ─── SIM EXAM ───────────────────────────────────────────────────── */
    .sim-launch { padding: 32px; text-align: center; max-width: 600px; margin: 0 auto; }
    .sim-launch h2 { font-family: var(--display); font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    .sim-launch p { color: var(--ink-mid); font-size: 14px; margin-bottom: 8px; line-height: 1.65; }
    .sim-launch .specs { background: var(--cream-alt); border-radius: 10px; padding: 16px; margin: 20px 0; font-family: var(--mono); font-size: 12px; color: var(--ink-mid); display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; text-align: left; }
    .sim-launch .specs .lbl { color: var(--accent); font-weight: 700; letter-spacing: 1px; }

    .sim-bar { background: var(--white); border-bottom: 1px solid var(--border); padding: 12px 24px; position: sticky; top: 56px; z-index: 49; display: flex; justify-content: space-between; align-items: center; }
    .sim-bar .timer { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
    .sim-bar .timer.warn { color: var(--accent); }
    .sim-bar .nav-info { font-family: var(--mono); font-size: 11px; color: var(--ink-muted); letter-spacing: 1px; }

    .sim-results { max-width: 700px; margin: 0 auto; }
    .sim-results .score-card { padding: 32px; text-align: center; }
    .sim-results .score-big { font-family: var(--display); font-size: 64px; font-weight: 800; color: var(--accent); line-height: 1; margin-bottom: 6px; }
    .sim-results .score-big.pass { color: var(--success); }
    .sim-results .score-sub { font-family: var(--mono); font-size: 11px; color: var(--ink-muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
    .sim-results .score-verdict { font-family: var(--display); font-size: 22px; font-weight: 800; color: var(--ink); margin-bottom: 14px; }
    .sim-results .score-breakdown { background: var(--cream-alt); border-radius: 10px; padding: 16px; margin: 18px 0; font-size: 13px; color: var(--ink-mid); }

    /* ─── LOADING + EMPTY ─────────────────────────────────────────────── */
    .empty { text-align: center; padding: 60px 20px; color: var(--ink-muted); }
    .empty .ico { font-size: 36px; margin-bottom: 12px; }
    .empty h3 { font-family: var(--display); font-size: 20px; font-weight: 800; color: var(--ink); margin-bottom: 6px; }
    .empty p { font-size: 14px; line-height: 1.6; max-width: 460px; margin: 0 auto; }

    .loading { display: flex; align-items: center; justify-content: center; min-height: 50vh; }
    .loading .dots { display: flex; gap: 7px; }
    .loading .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: blink 1.2s ease-in-out infinite; }
    .loading .dot:nth-child(2) { animation-delay: 0.2s; }
    .loading .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }

    /* ─── RESPONSIVE ─────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .header { padding: 12px 16px; }
      .header .product { display: none; }
      .tabs { padding: 0 8px; }
      .tab { padding: 12px 12px; font-size: 12px; }
      .main { padding: 16px; }
      .hero { padding: 22px; }
      .hero h2 { font-size: 22px; }
      .picker-card { padding: 22px; max-height: 95vh; }
      .picker h1 { font-size: 24px; }
      .sim-launch .specs { grid-template-columns: 1fr; }
      .reader h2 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="loading"><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
  </div>

  <!-- Data loader (ES modules) -->
  <script type="module">
    try {
      const mods = await import('./hvac-modules.js');
      const content = await import('./module-content-hvac.js');
      const quiz = await import('./quiz-bank-hvac.js');
      window.HVAC = {
        MODULES: mods.HVAC_MODULES,
        TRACKS: mods.HVAC_TRACKS,
        TAG_COLORS: mods.HVAC_TAG_COLORS,
        WEEKS: mods.HVAC_WEEKS,
        PRODUCT: mods.HVAC_PRODUCT,
        CONTENT: content.HVAC_MODULE_CONTENT,
        QUESTIONS: quiz.HVAC_ALL_QUESTIONS,
      };
      window.dispatchEvent(new Event('hvac-ready'));
    } catch (e) {
      document.getElementById('app').innerHTML =
        `<div class="empty" style="padding:80px 20px">
           <div class="ico">⚠️</div>
           <h3>Content still loading</h3>
           <p>The HVAC content modules haven't finished generating yet. Refresh in a few minutes — or open this page directly via the live URL (file:// won't load ES modules).</p>
           <p style="margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--ink-muted)">${e.message}</p>
         </div>`;
    }
  </script>

  <!-- Main app -->
  <script>
  (function() {
    // ─── STATE ────────────────────────────────────────────────────────
    const LS_KEY = 'hvac-prep-state-v1';
    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      return {
        track: null,           // 'A' | 'B' | 'G' | 'E'
        view: 'dashboard',     // 'dashboard' | 'modules' | 'reader' | 'practice' | 'sim' | 'sim-results'
        currentModule: null,   // module id when in reader
        currentTab: 0,         // article tab index in reader
        completedModules: [],  // ids
        practice: null,        // {questions, idx, selected, revealed, correctCount}
        sim: null,             // {questions, idx, answers, startTime, durationSec, finished, score}
        simHistory: [],        // [{date, track, score, pct, pass}]
      };
    }
    function saveState() {
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch {}
    }

    // ─── MARKDOWN (mini) ───────────────────────────────────────────────
    function md(s) {
      if (!s) return '';
      // Escape HTML
      s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      // **Exam Trap:** callout — entire paragraph becomes the trap block
      // We process this on each paragraph below
      const paras = s.split(/\n\s*\n/);
      return paras.map(p => {
        p = p.trim();
        if (!p) return '';
        // Detect "**Exam Trap:** ..." → trap block
        const trapMatch = p.match(/^\*\*Exam Trap:\*\*\s*([\s\S]*)$/);
        if (trapMatch) {
          return `<div class="trap"><span class="trap-label">Exam Trap</span>${inlineBold(trapMatch[1])}</div>`;
        }
        // Detect "**Key Formula:**" or "**Formula:**" → formula block
        const formulaMatch = p.match(/^\*\*(?:Key Formula|Formula):\*\*\s*([\s\S]*)$/);
        if (formulaMatch) {
          return `<div class="formula"><span class="formula-label">Key Formula</span>${inlineBold(formulaMatch[1])}</div>`;
        }
        return `<p>${inlineBold(p)}</p>`;
      }).join('');
    }
    function inlineBold(s) {
      return s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
              .replace(/\n/g, '<br>');
    }

    // ─── HELPERS ───────────────────────────────────────────────────────
    function H(strings, ...vals) {
      // Tagged template that returns string (we keep it simple)
      let out = '';
      strings.forEach((s, i) => { out += s + (vals[i] != null ? String(vals[i]) : ''); });
      return out;
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g,'&quot;');
    }
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function fmtTime(s) {
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
      return `${m}:${String(sec).padStart(2,'0')}`;
    }
    function modsForTrack(t) {
      return window.HVAC.MODULES.filter(m => !t || m.tracks.includes(t));
    }
    function questionsForTrack(t, moduleId) {
      return window.HVAC.QUESTIONS.filter(q => {
        if (t && !q.tracks.includes(t)) return false;
        if (moduleId && q.module !== moduleId) return false;
        return true;
      });
    }
    function trackBadge(t) {
      const tr = window.HVAC.TRACKS[t];
      return `<span class="badge" style="background:var(--accent-soft);color:var(--accent)">${tr.exam} · ${tr.short}</span>`;
    }
    function tagColor(tag) {
      const c = window.HVAC.TAG_COLORS[tag];
      if (!c) return 'background:var(--accent-soft);color:var(--accent)';
      return `background:${c.bg};color:${c.color}`;
    }

    // ─── RENDER: SHELL ─────────────────────────────────────────────────
    function render() {
      const app = document.getElementById('app');
      if (!state.track) {
        app.innerHTML = renderPicker();
        bindPickerEvents();
        return;
      }
      app.innerHTML =
        renderHeader() +
        (state.view === 'sim' && state.sim && !state.sim.finished ? renderSimBar() : renderTabs()) +
        '<main class="main" id="main"></main>' +
        renderFooter();
      renderView();
      bindShellEvents();
    }

    function renderHeader() {
      const track = window.HVAC.TRACKS[state.track];
      return `
        <header class="header">
          <div class="brand">
            <svg viewBox="0 0 44 52" fill="none">
              <path d="M4 8 L22 2 L40 8 L40 30 C40 42 22 50 22 50 C22 50 4 42 4 30 Z" fill="#F0EDE8"/>
              <path d="M14 27 L19 33 L30 19" stroke="#C8390E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="brand-name">CertifyPro</span>
            <span class="badge-co">CO</span>
            <span class="product">· Denver HVAC Prep</span>
          </div>
          <button class="track-pill" id="change-track">${escapeHtml(track.exam)} · ${escapeHtml(track.short)} ✎</button>
        </header>`;
    }

    function renderTabs() {
      const tabs = [
        { id:'dashboard', icon:'⊞', label:'Dashboard' },
        { id:'modules',   icon:'📖', label:'Modules' },
        { id:'practice',  icon:'⚡', label:'Practice' },
        { id:'sim',       icon:'⏱',  label:'Sim Exam' },
      ];
      return `
        <nav class="tabs">
          ${tabs.map(t => `
            <button class="tab ${state.view.startsWith(t.id) || (state.view==='reader' && t.id==='modules') ? 'active' : ''}" data-tab="${t.id}">
              <span class="tab-icon">${t.icon}</span>${t.label}
            </button>`).join('')}
        </nav>`;
    }

    function renderFooter() {
      return `
        <footer class="footer">
          <div class="disclaimer">
            <strong>Verify with Denver CPD before scheduling.</strong> This prep targets <strong>2018 IMC + 2018 IFGC</strong> (ICC G29 reference materials). Denver permits as of June 2025 use 2024 IMC. Confirm with Denver Community Planning &amp; Development which exam code/edition you'll sit. EPA 608 is a separate federal certification.
          </div>
          CertifyPro · Denver HVAC Prep · Built for license candidates, not legal advice.
        </footer>`;
    }

    // ─── RENDER: TRACK PICKER ──────────────────────────────────────────
    function renderPicker() {
      const opts = ['A','B','G','E'].map(code => {
        const t = window.HVAC.TRACKS[code];
        return `
          <button class="opt" data-track="${code}">
            <div>
              <div class="opt-title">${escapeHtml(t.name)}</div>
              <div class="opt-desc">${escapeHtml(t.desc)}</div>
              <div class="opt-meta" style="margin-top:8px">${escapeHtml(t.exam)} · ${t.questions}Q · ${Math.round(t.timeMin/60*10)/10} hr · ${t.pass}% pass${t.open===true?' · open book':''}</div>
            </div>
            <div class="opt-arrow">→</div>
          </button>`;
      }).join('');
      return `
        <div class="picker">
          <div class="picker-card">
            <div class="subtitle">Denver Colorado · 2026</div>
            <h1>Pick your exam path.</h1>
            <p class="lead">This bundle covers every Denver mechanical supervisor exam plus the federal EPA 608 refrigerant cert. Pick the one you're sitting for — content and practice questions will filter to match. You can switch anytime.</p>
            <div class="options">${opts}</div>
            <div class="picker-foot">
              Building HVAC on a commercial project (hotel, restaurant, mid- or high-rise)? You want <strong>F29 / Class A</strong>. Doing residential service or replacement? <strong>F32 / Class B</strong>. Gas piping only? <strong>F33</strong>. Need refrigerant cert for any HVAC work nationwide? <strong>EPA 608</strong>.
            </div>
          </div>
        </div>`;
    }

    function bindPickerEvents() {
      document.querySelectorAll('.picker .opt').forEach(b => {
        b.onclick = () => {
          state.track = b.getAttribute('data-track');
          state.view = 'dashboard';
          saveState();
          render();
        };
      });
    }

    function bindShellEvents() {
      const changeBtn = document.getElementById('change-track');
      if (changeBtn) changeBtn.onclick = () => { state.track = null; state.view='dashboard'; saveState(); render(); };
      document.querySelectorAll('.tab').forEach(t => {
        t.onclick = () => {
          const id = t.getAttribute('data-tab');
          state.view = id;
          if (id === 'practice') startPractice();
          if (id === 'sim') {
            // do nothing yet — landing page will offer start
            state.sim = null;
          }
          saveState();
          render();
        };
      });
    }

    // ─── RENDER: VIEWS ─────────────────────────────────────────────────
    function renderView() {
      const main = document.getElementById('main');
      if (!main) return;
      if (state.view === 'dashboard') main.innerHTML = renderDashboard();
      else if (state.view === 'modules') main.innerHTML = renderModulesList();
      else if (state.view === 'reader') main.innerHTML = renderReader();
      else if (state.view === 'practice') main.innerHTML = renderPractice();
      else if (state.view === 'sim') main.innerHTML = renderSim();
      else if (state.view === 'sim-results') main.innerHTML = renderSimResults();
      bindViewEvents();
    }

    function renderDashboard() {
      const track = window.HVAC.TRACKS[state.track];
      const mods = modsForTrack(state.track);
      const done = mods.filter(m => state.completedModules.includes(m.id)).length;
      const total = mods.length;
      const pct = total ? Math.round(done/total*100) : 0;
      const qCount = questionsForTrack(state.track).length;
      const totalMins = mods.reduce((a,m) => a + (m.mins||0), 0);
      const lastSim = state.simHistory.filter(s => s.track === state.track).slice(-1)[0];
      const weekProgressBars = window.HVAC.WEEKS.map(w => {
        const wmods = w.mods.filter(id => modsForTrack(state.track).find(m=>m.id===id));
        if (wmods.length === 0) return '';
        const wdone = wmods.filter(id => state.completedModules.includes(id)).length;
        const wpct = Math.round(wdone/wmods.length*100);
        return `
          <div class="card pcard">
            <div class="pcard-lbl">Week ${w.w} · ${escapeHtml(w.title)}</div>
            <div class="pcard-val">${wdone}<span style="color:var(--ink-muted);font-size:14px;font-family:var(--mono);font-weight:600;letter-spacing:1px"> / ${wmods.length}</span></div>
            <div style="font-size:11px;color:var(--ink-muted);margin-bottom:8px">${escapeHtml(w.focus)}</div>
            <div class="bar-bg"><div class="bar" style="width:${wpct}%"></div></div>
          </div>`;
      }).join('');

      return `
        <section class="hero">
          <h2>${escapeHtml(track.name)}</h2>
          <p>${escapeHtml(track.desc)}</p>
          <div class="stats">
            <div><div class="stat-num">${track.questions}</div><div class="stat-lbl">EXAM Q · ${Math.round(track.timeMin/60*10)/10} HR</div></div>
            <div><div class="stat-num">${total}</div><div class="stat-lbl">MODULES (${totalMins} MIN)</div></div>
            <div><div class="stat-num">${qCount}</div><div class="stat-lbl">PRACTICE Q</div></div>
            <div><div class="stat-num">${pct}%</div><div class="stat-lbl">COMPLETE</div></div>
          </div>
        </section>

        <div class="section-head"><h3>Your study path</h3><span class="hint">${escapeHtml(track.refs.join(' · '))}</span></div>
        <div class="progress-grid">${weekProgressBars}</div>

        ${lastSim ? `
          <div class="section-head"><h3>Last sim exam</h3><span class="hint">${escapeHtml(lastSim.date)}</span></div>
          <div class="card pcard">
            <div class="pcard-lbl">${lastSim.pass ? 'PASSED' : 'KEEP GOING'} · ${escapeHtml(track.exam)}</div>
            <div class="pcard-val" style="color:${lastSim.pass ? 'var(--success)' : 'var(--accent)'}">${lastSim.pct}%</div>
            <div style="font-size:12px;color:var(--ink-muted)">${lastSim.score} of ${lastSim.total} correct</div>
          </div>
        ` : ''}

        <div class="section-head" style="margin-top:28px"><h3>Start studying</h3></div>
        <div class="mod-grid">
          <button class="mod-card" data-go="modules">
            <div class="mod-num">📖 BROWSE</div>
            <div class="mod-title">Open module library</div>
            <div class="mod-articles">${total} modules filtered to ${escapeHtml(track.exam)}, each with 3 article tabs and an Exam Trap callout.</div>
          </button>
          <button class="mod-card" data-go="practice">
            <div class="mod-num">⚡ DRILL</div>
            <div class="mod-title">Start a practice quiz</div>
            <div class="mod-articles">10 random questions from your track. Explanations and code citations on every answer.</div>
          </button>
          <button class="mod-card" data-go="sim">
            <div class="mod-num">⏱ TIMED</div>
            <div class="mod-title">Take a sim exam</div>
            <div class="mod-articles">${track.questions} questions in ${Math.round(track.timeMin/60*10)/10} hours — full exam-day simulation.</div>
          </button>
        </div>
      `;
    }

    function renderModulesList() {
      const mods = modsForTrack(state.track);
      const cards = mods.map(m => {
        const done = state.completedModules.includes(m.id);
        const tracksHtml = m.tracks.map(t => `<span class="pill track">${window.HVAC.TRACKS[t].exam}</span>`).join('');
        const tagStyle = tagColor(m.tag);
        return `
          <button class="mod-card ${done?'done':''}" data-mod="${m.id}">
            <div class="mod-num">MODULE ${escapeHtml(m.num)} ${done?' · ✓':''}</div>
            <div class="mod-title">${escapeHtml(m.title)}</div>
            <div class="mod-articles">${m.articles.map(a => `• ${escapeHtml(a)}`).join('<br>')}</div>
            <div class="mod-meta">
              <span class="pill" style="${tagStyle}">${escapeHtml(m.tag)}</span>
              ${tracksHtml}
              <span class="mins">${m.mins} min</span>
            </div>
          </button>`;
      }).join('');
      return `
        <div class="section-head">
          <h3>${mods.length} modules for ${escapeHtml(window.HVAC.TRACKS[state.track].exam)}</h3>
          <span class="hint">${state.completedModules.filter(id => mods.find(m=>m.id===id)).length} / ${mods.length} completed</span>
        </div>
        <div class="mod-grid">${cards}</div>
      `;
    }

    function renderReader() {
      const m = window.HVAC.MODULES.find(x => x.id === state.currentModule);
      if (!m) return '<div class="empty"><h3>Module not found.</h3></div>';
      const content = window.HVAC.CONTENT[m.id] || {};
      const tabKeys = m.articles;
      const activeKey = tabKeys[state.currentTab] || tabKeys[0];
      const activeContent = content[activeKey] || '_Content not yet available for this article._';
      const done = state.completedModules.includes(m.id);

      return `
        <div class="reader">
          <button class="back" id="reader-back">← All modules</button>
          <div class="mod-sub">MODULE ${escapeHtml(m.num)} · ${escapeHtml(m.tag.toUpperCase())} · ${m.tracks.map(t => window.HVAC.TRACKS[t].exam).join(' / ')}</div>
          <h2>${escapeHtml(m.title)}</h2>
          <div class="article-tabs">
            ${tabKeys.map((k,i) => `<button class="art-tab ${i===state.currentTab?'active':''}" data-tabi="${i}">${escapeHtml(k)}</button>`).join('')}
          </div>
          <div class="art-content">${md(activeContent)}</div>
          <button class="mark-done ${done?'done':''}" id="mark-done">${done ? '✓ Module completed — click to mark unread' : 'Mark module as complete'}</button>
        </div>
      `;
    }

    // ─── PRACTICE ──────────────────────────────────────────────────────
    function startPractice() {
      const pool = questionsForTrack(state.track);
      const picked = shuffle(pool).slice(0, 10);
      state.practice = { questions: picked, idx: 0, selected: null, revealed: false, correctCount: 0 };
      saveState();
    }
    function renderPractice() {
      if (!state.practice) startPractice();
      const p = state.practice;
      if (!p.questions.length) {
        return `<div class="empty"><div class="ico">📭</div><h3>No questions for this track yet.</h3><p>The quiz bank may still be generating. Refresh in a few minutes.</p></div>`;
      }
      if (p.idx >= p.questions.length) {
        return renderPracticeResults();
      }
      const q = p.questions[p.idx];
      const opts = q.opts.map((o, i) => {
        let cls = 'quiz-opt';
        if (p.revealed) {
          if (i === q.ans) cls += ' correct';
          else if (i === p.selected) cls += ' wrong';
        } else if (i === p.selected) cls += ' selected';
        return `<button class="${cls}" data-opt="${i}" ${p.revealed?'disabled':''}>${String.fromCharCode(65+i)}. ${escapeHtml(o)}</button>`;
      }).join('');

      const explanation = p.revealed
        ? `<div class="quiz-exp ${p.selected===q.ans?'correct':'wrong'}">
             <span class="exp-lbl">${p.selected===q.ans?'Correct':'Not quite'}</span>
             ${escapeHtml(q.exp)}
           </div>` : '';

      return `
        <div class="quiz">
          <div class="quiz-head">
            <h2>Practice quiz</h2>
            <span class="qnum">Q ${p.idx+1} / ${p.questions.length} · ${p.correctCount} correct</span>
          </div>
          <div class="card quiz-card">
            <div class="quiz-art">${escapeHtml(q.art)} · Module ${q.module}</div>
            <div class="quiz-q">${escapeHtml(q.q)}</div>
            <div class="quiz-opts">${opts}</div>
            ${explanation}
            <div class="quiz-controls">
              ${!p.revealed
                ? `<button class="btn btn-primary" id="quiz-submit" ${p.selected==null?'disabled':''}>Submit answer</button>`
                : `<button class="btn btn-primary" id="quiz-next">${p.idx+1 < p.questions.length ? 'Next question →' : 'See results →'}</button>`
              }
              <button class="btn btn-ghost" id="quiz-restart">Start new set</button>
            </div>
          </div>
        </div>
      `;
    }
    function renderPracticeResults() {
      const p = state.practice;
      const pct = Math.round(p.correctCount / p.questions.length * 100);
      return `
        <div class="quiz">
          <div class="card sim-launch">
            <h2>${p.correctCount} / ${p.questions.length}</h2>
            <p style="font-family:var(--mono);font-size:11px;letter-spacing:2px;color:${pct>=70?'var(--success)':'var(--accent)'};text-transform:uppercase;margin-bottom:14px">${pct}% · ${pct>=70?'Solid':'Drill more'}</p>
            <p>You answered ${p.correctCount} of ${p.questions.length} correctly. Run another set or jump to a module reading.</p>
            <div class="quiz-controls" style="justify-content:center;margin-top:16px">
              <button class="btn btn-primary" id="quiz-restart">Start new 10-question set</button>
              <button class="btn btn-ghost" id="goto-modules">Open modules</button>
            </div>
          </div>
        </div>
      `;
    }

    // ─── SIM EXAM ──────────────────────────────────────────────────────
    let simTimer = null;
    function startSim() {
      const track = window.HVAC.TRACKS[state.track];
      const pool = questionsForTrack(state.track);
      const n = Math.min(track.questions, pool.length);
      const picked = shuffle(pool).slice(0, n);
      state.sim = {
        questions: picked,
        idx: 0,
        answers: new Array(n).fill(null),
        startTime: Date.now(),
        durationSec: track.timeMin * 60,
        finished: false,
      };
      saveState();
    }
    function endSim() {
      if (!state.sim || state.sim.finished) return;
      const track = window.HVAC.TRACKS[state.track];
      let correct = 0;
      state.sim.questions.forEach((q, i) => {
        if (state.sim.answers[i] === q.ans) correct++;
      });
      const total = state.sim.questions.length;
      const pct = Math.round(correct / total * 100);
      const pass = pct >= track.pass;
      state.sim.finished = true;
      state.sim.score = { correct, total, pct, pass };
      state.simHistory.push({
        date: new Date().toISOString().slice(0,10),
        track: state.track,
        score: correct, total, pct, pass,
      });
      state.view = 'sim-results';
      saveState();
      if (simTimer) { clearInterval(simTimer); simTimer = null; }
      render();
    }
    function renderSim() {
      if (!state.sim) {
        const track = window.HVAC.TRACKS[state.track];
        return `
          <div class="card sim-launch">
            <h2>${escapeHtml(track.exam)} Sim Exam</h2>
            <p>${escapeHtml(track.name)}. Full exam-day simulation — timed, no answers shown until the end. You can navigate forward through questions and review at any time.</p>
            <div class="specs">
              <div><span class="lbl">QUESTIONS</span></div><div>${track.questions} multiple choice</div>
              <div><span class="lbl">TIME</span></div><div>${Math.round(track.timeMin/60*10)/10} hours (${track.timeMin} min)</div>
              <div><span class="lbl">PASS</span></div><div>${track.pass}%</div>
              <div><span class="lbl">FORMAT</span></div><div>${track.open===true?'Open book':track.open}</div>
              <div><span class="lbl">REFERENCES</span></div><div>${escapeHtml(track.refs.join(', '))}</div>
            </div>
            <div class="quiz-controls" style="justify-content:center">
              <button class="btn btn-primary" id="sim-start">Begin sim exam →</button>
            </div>
          </div>
        `;
      }
      const s = state.sim;
      const q = s.questions[s.idx];
      const opts = q.opts.map((o,i) =>
        `<button class="quiz-opt ${s.answers[s.idx]===i?'selected':''}" data-simopt="${i}">${String.fromCharCode(65+i)}. ${escapeHtml(o)}</button>`
      ).join('');
      return `
        <div class="quiz">
          <div class="card quiz-card">
            <div class="quiz-art">Q ${s.idx+1} / ${s.questions.length}</div>
            <div class="quiz-q">${escapeHtml(q.q)}</div>
            <div class="quiz-opts">${opts}</div>
            <div class="quiz-controls">
              <button class="btn btn-ghost" id="sim-prev" ${s.idx===0?'disabled':''}>← Previous</button>
              <button class="btn btn-primary" id="sim-next">${s.idx+1<s.questions.length?'Next →':'Review answers'}</button>
              <button class="btn btn-dark" id="sim-finish" style="margin-left:auto">End exam</button>
            </div>
            <div style="margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--ink-muted);letter-spacing:1px">${s.answers.filter(a=>a!=null).length} of ${s.questions.length} answered</div>
          </div>
        </div>
      `;
    }
    function renderSimBar() {
      const elapsed = Math.floor((Date.now() - state.sim.startTime)/1000);
      const remaining = Math.max(0, state.sim.durationSec - elapsed);
      const warn = remaining < 600;
      return `
        <div class="sim-bar">
          <div class="nav-info">SIM EXAM · ${escapeHtml(window.HVAC.TRACKS[state.track].exam)}</div>
          <div class="timer ${warn?'warn':''}" id="sim-timer">${fmtTime(remaining)}</div>
          <div class="nav-info">${state.sim.answers.filter(a=>a!=null).length} / ${state.sim.questions.length}</div>
        </div>
      `;
    }
    function renderSimResults() {
      const s = state.sim;
      const track = window.HVAC.TRACKS[state.track];
      if (!s || !s.score) return '<div class="empty"><h3>No sim exam results.</h3></div>';
      const wrong = s.questions.map((q,i) => ({ q, picked: s.answers[i], idx: i })).filter(x => x.picked !== x.q.ans);
      return `
        <div class="sim-results">
          <div class="card score-card">
            <div class="score-big ${s.score.pass?'pass':''}">${s.score.pct}%</div>
            <div class="score-sub">${s.score.correct} / ${s.score.total} correct · pass ${track.pass}%</div>
            <div class="score-verdict">${s.score.pass ? 'You passed.' : 'Not yet — keep drilling.'}</div>
            <div class="score-breakdown">
              ${wrong.length} questions missed. Review the explanations below and revisit the linked modules before your next sim run.
            </div>
            <div class="quiz-controls" style="justify-content:center">
              <button class="btn btn-primary" id="sim-restart">New sim exam</button>
              <button class="btn btn-ghost" id="goto-dashboard">Back to dashboard</button>
            </div>
          </div>
          ${wrong.length ? `
            <div class="section-head" style="margin-top:28px"><h3>Review missed questions</h3><span class="hint">${wrong.length} TO REVIEW</span></div>
            ${wrong.map(({q, picked, idx}) => `
              <div class="card quiz-card" style="margin-bottom:12px">
                <div class="quiz-art">Q ${idx+1} · ${escapeHtml(q.art)} · Module ${q.module}</div>
                <div class="quiz-q">${escapeHtml(q.q)}</div>
                <div class="quiz-opts">
                  ${q.opts.map((o,i) => {
                    let cls = 'quiz-opt';
                    if (i === q.ans) cls += ' correct';
                    else if (i === picked) cls += ' wrong';
                    return `<button class="${cls}" disabled>${String.fromCharCode(65+i)}. ${escapeHtml(o)}</button>`;
                  }).join('')}
                </div>
                <div class="quiz-exp"><span class="exp-lbl">Explanation</span>${escapeHtml(q.exp)}</div>
              </div>
            `).join('')}
          ` : ''}
        </div>
      `;
    }

    // ─── EVENT BINDING (per view) ──────────────────────────────────────
    function bindViewEvents() {
      // Dashboard "go" buttons
      document.querySelectorAll('[data-go]').forEach(b => {
        b.onclick = () => {
          const id = b.getAttribute('data-go');
          state.view = id;
          if (id === 'practice') startPractice();
          saveState(); render();
        };
      });

      // Modules list → reader
      document.querySelectorAll('[data-mod]').forEach(b => {
        b.onclick = () => {
          state.currentModule = parseInt(b.getAttribute('data-mod'), 10);
          state.currentTab = 0;
          state.view = 'reader';
          saveState(); render();
        };
      });

      // Reader back / tab switch / mark-done
      const back = document.getElementById('reader-back');
      if (back) back.onclick = () => { state.view='modules'; state.currentModule=null; saveState(); render(); };
      document.querySelectorAll('.art-tab').forEach(t => {
        t.onclick = () => { state.currentTab = parseInt(t.getAttribute('data-tabi'),10); saveState(); render(); };
      });
      const mk = document.getElementById('mark-done');
      if (mk) mk.onclick = () => {
        const id = state.currentModule;
        if (state.completedModules.includes(id)) {
          state.completedModules = state.completedModules.filter(x => x !== id);
        } else {
          state.completedModules.push(id);
        }
        saveState(); render();
      };

      // Practice
      document.querySelectorAll('[data-opt]').forEach(b => {
        b.onclick = () => {
          if (state.practice.revealed) return;
          state.practice.selected = parseInt(b.getAttribute('data-opt'),10);
          saveState(); render();
        };
      });
      const submit = document.getElementById('quiz-submit');
      if (submit) submit.onclick = () => {
        const p = state.practice;
        if (p.selected == null) return;
        p.revealed = true;
        if (p.selected === p.questions[p.idx].ans) p.correctCount++;
        saveState(); render();
      };
      const next = document.getElementById('quiz-next');
      if (next) next.onclick = () => {
        state.practice.idx++;
        state.practice.selected = null;
        state.practice.revealed = false;
        saveState(); render();
      };
      const restart = document.getElementById('quiz-restart');
      if (restart) restart.onclick = () => { startPractice(); render(); };
      const gotoMods = document.getElementById('goto-modules');
      if (gotoMods) gotoMods.onclick = () => { state.view='modules'; saveState(); render(); };

      // Sim exam
      const simStart = document.getElementById('sim-start');
      if (simStart) simStart.onclick = () => { startSim(); render(); startSimTimer(); };
      document.querySelectorAll('[data-simopt]').forEach(b => {
        b.onclick = () => {
          state.sim.answers[state.sim.idx] = parseInt(b.getAttribute('data-simopt'),10);
          saveState();
          // Re-render to show selection
          render();
        };
      });
      const simPrev = document.getElementById('sim-prev');
      if (simPrev) simPrev.onclick = () => { if(state.sim.idx>0){state.sim.idx--; saveState(); render();} };
      const simNext = document.getElementById('sim-next');
      if (simNext) simNext.onclick = () => {
        if (state.sim.idx + 1 < state.sim.questions.length) { state.sim.idx++; saveState(); render(); }
        else { endSim(); }
      };
      const simFinish = document.getElementById('sim-finish');
      if (simFinish) simFinish.onclick = () => {
        if (confirm('End the exam now? Your score will be calculated from what you\'ve answered.')) endSim();
      };
      const simRestart = document.getElementById('sim-restart');
      if (simRestart) simRestart.onclick = () => { state.sim = null; state.view = 'sim'; saveState(); render(); };
      const goDash = document.getElementById('goto-dashboard');
      if (goDash) goDash.onclick = () => { state.view = 'dashboard'; saveState(); render(); };

      // If sim is running and timer not started (e.g., page reload), start it
      if (state.view === 'sim' && state.sim && !state.sim.finished && !simTimer) startSimTimer();
    }

    function startSimTimer() {
      if (simTimer) clearInterval(simTimer);
      simTimer = setInterval(() => {
        if (!state.sim || state.sim.finished) { clearInterval(simTimer); simTimer = null; return; }
        const elapsed = Math.floor((Date.now() - state.sim.startTime)/1000);
        const remaining = state.sim.durationSec - elapsed;
        const el = document.getElementById('sim-timer');
        if (el) {
          el.textContent = fmtTime(Math.max(0, remaining));
          if (remaining < 600) el.classList.add('warn');
        }
        if (remaining <= 0) endSim();
      }, 1000);
    }

    // ─── BOOT ──────────────────────────────────────────────────────────
    window.addEventListener('hvac-ready', render);
    // Also re-render on resize? Not necessary for now.
  })();
  </script>
</body>
</html>
